
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standard Work CAD Layout Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; color: #ccc; overflow: hidden; }
    
    /* Top Bar Header */
    #top-bar { height: 46px; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 20; gap: 8px; }
    .top-group { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    
    /* Process Symbol & Scale Row */
    #second-bar { background: #1b1b1c; border-bottom: 1px solid #3c3c3c; padding: 4px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; z-index: 15; min-height: 42px; flex-wrap: wrap; }
    #process-container { display: flex; align-items: center; gap: 6px; overflow-x: auto; white-space: nowrap; flex: 1; }
    .bar-title { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: #00ffcc; margin-right: 2px; }

    /* Rearranged Inspector Bar */
    #inspector-container { display: flex; align-items: center; gap: 8px; background: #2d2d2d; padding: 4px 12px; border-radius: 4px; border: 1px solid #3c3c3c; flex-shrink: 0; }
    #inspector-container label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; font-weight: bold; }
    #inspector-container input, #inspector-container select { height: 26px; padding: 2px 4px; }

    /* Scale Container in 2nd Row */
    #scale-container { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    #scale-container label { font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: 600; white-space: nowrap; }

    /* Main Workspace Layout */
    #app-body { flex: 1; display: flex; position: relative; overflow: hidden; }

    /* Vertical LHS Toolbar */
    #left-toolbar { width: 52px; background: #252526; border-right: 1px solid #3c3c3c; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 6px; z-index: 10; flex-shrink: 0; overflow-y: auto; }
    
    /* Vertical RHS Toolbar */
    #right-toolbar { width: 140px; background: #252526; border-left: 1px solid #3c3c3c; display: flex; flex-direction: column; align-items: center; padding: 8px 6px; gap: 6px; z-index: 10; flex-shrink: 0; overflow-y: auto; }
    .rhs-title { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; color: #00ffcc; margin-bottom: 4px; text-align: center; width: 100%; border-bottom: 1px solid #3c3c3c; padding-bottom: 4px; }

    .tool-btn-lhs { width: 40px; height: 40px; padding: 0; border: 1px solid transparent; background: transparent; color: #ccc; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
    .tool-btn-lhs:hover { background: #333333; color: #fff; border-color: #454545; }
    .tool-btn-lhs.active { background: #007acc; color: #fff; border-color: #007acc; }

    .tool-btn-rhs { width: 100%; height: 32px; padding: 0 6px; border: 1px solid #3c3c3c; background: #2d2d2d; color: #ccc; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 6px; transition: all 0.2s; flex-shrink: 0; font-size: 0.7rem; font-weight: 500; }
    .tool-btn-rhs:hover { background: #3c3c3c; color: #fff; border-color: #555; }
    .tool-btn-rhs.active { background: #007acc; color: #fff; border-color: #007acc; }

    button { padding: 5px 10px; border: 1px solid #007acc; background: #007acc; color: white; border-radius: 3px; cursor: pointer; font-weight: 600; font-size: 0.75rem; transition: background 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    button:hover { background: #0062a3; }
    button.secondary { background: #333; color: #ccc; border-color: #454545; }
    button.secondary:hover { background: #444; color: #fff; }
    button.secondary.active { background: #007acc; color: #fff; border-color: #007acc; }
    button.danger { background: #a93226; border-color: #a93226; }
    button.danger:hover { background: #922b21; }
    button.success { background: #27ae60; border-color: #27ae60; }
    button.success:hover { background: #219653; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
    .btn-svg-rhs { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    /* Canvas Viewport */
    #main { flex: 1; display: flex; flex-direction: column; position: relative; background: #121212; }
    #canvas-container { flex: 1; position: relative; cursor: crosshair; overflow: hidden; }
    canvas { display: block; outline: none; }
    
    input[type="number"], select, input[type="text"], input[type="color"] { padding: 4px 6px; border: 1px solid #3c3c3c; background: #333333; color: #fff; border-radius: 3px; font-size: 0.8rem; }
    .info-badge { background: #007acc22; border: 1px solid #007acc; color: #61afef; padding: 4px 8px; border-radius: 3px; font-size: 0.75rem; font-family: monospace; white-space: nowrap; }
    .coord-hud { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7); border: 1px solid #444; color: #00ffcc; padding: 4px 8px; font-family: monospace; font-size: 0.75rem; border-radius: 3px; pointer-events: none; }

    #cursor-hud {
      position: absolute; display: none; pointer-events: none; background: rgba(15, 23, 42, 0.92); border: 1px solid #00ffcc; color: #00ffcc; font-family: 'Consolas', monospace; font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; z-index: 100; white-space: nowrap;
    }

    #inline-text-input {
      position: absolute; display: none; z-index: 1000; background: rgba(30,30,30,0.95); border: 1px solid #00ffcc; color: #fff; padding: 4px 8px; font-size: 14px; font-family: sans-serif; outline: none; border-radius: 3px; min-width: 120px;
    }
  </style>
</head>
<body>

  <!-- TOP BAR: ACTIONS -->
  <div id="top-bar">
    <div class="top-group">
      <button class="secondary" onclick="undo()" id="undoBtn" title="Undo (Ctrl+Z)" disabled>
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg> Undo
      </button>
      <button class="secondary" onclick="redo()" id="redoBtn" title="Redo (Ctrl+Y)" disabled>
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.96 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg> Redo
      </button>
      <button class="secondary" onclick="triggerImageUpload()" title="Insert Image">Insert Image</button>
      <input type="file" id="imageLoader" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
      
      <!-- Project Save/Open Controls -->
      <button class="secondary" onclick="saveProjectJson()" title="Save Editable Drawing (.json)">Save Project</button>
      <button class="secondary" onclick="triggerJsonImport()" title="Open Editable Drawing (.json)">Open Project</button>
      <input type="file" id="jsonLoader" accept=".json" style="display:none;" onchange="handleJsonImport(event)">

      <!-- Export Options -->
      <button class="success" onclick="exportToPDF()" title="Export Final Drawing as PDF">Save PDF</button>
      <button class="secondary" onclick="createNewPage()">New</button>
      
      <span style="width:1px; height:20px; background:#3c3c3c; margin: 0 4px;"></span>
      <label style="font-size:0.75rem; color:#888;">Style:</label>
      <select id="globalLineStyle" style="height:26px;">
        <option value="solid">Solid ――</option>
        <option value="dashed">Dashed ---</option>
      </select>
    </div>

    <!-- Inspector Rearranged to Top Bar -->
    <div id="inspector-container">
      <span class="bar-title">INSPECTOR:</span>
      <div id="editPanel" style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size:0.75rem; color:#888;">No Selection</span>
      </div>
    </div>
  </div>

  <!-- SECOND BAR: PROCESS SYMBOLS, SCALE, GRID -->
  <div id="second-bar">
    <div id="process-container">
      <button class="secondary tool-btn" data-tool="pan" onclick="setMode('pan')" title="Pan Canvas">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M23 12l-4-4v3h-5V6h3l-4-4-4 4h3v5H6V8l-4 4 4 4v-3h5v5H8l4 4 4-4h-3v-5h5v3l4-4z"/></svg> Pan
      </button>
      <button class="secondary" onclick="copySelected()" title="Copy (Ctrl+C)">Copy</button>
      <button class="secondary" onclick="pasteClipboard()" title="Paste (Ctrl+V)">Paste</button>

      <span style="width:1px; height:20px; background:#3c3c3c; margin: 0 4px;"></span>
      <span class="bar-title">Process:</span>

      <button class="secondary tool-btn" data-tool="quality" onclick="setMode('quality')" title="Quality Check">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="#e74c3c"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3.83L18.17 12 12 18.17 5.83 12 12 5.83z"/></svg> Quality
      </button>
      <button class="secondary tool-btn" data-tool="safety" onclick="setMode('safety')" title="Safety">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="#2ecc71"><path d="M19 10.5h-5.5V5h-3v5.5H5v3h5.5V19h3v-5.5H19v-3z"/></svg> Safety
      </button>
      <button class="secondary tool-btn" data-tool="wip" onclick="setMode('wip')" title="Std WIP">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="2">
          <ellipse cx="12" cy="12" rx="10" ry="6"/>
          <line x1="5" y1="15" x2="15" y2="7"/>
          <line x1="8" y1="17" x2="18" y2="9"/>
          <line x1="11" y1="18" x2="19" y2="11"/>
        </svg> WIP
      </button>
      <button class="secondary tool-btn" data-tool="input_fg" onclick="setMode('input_fg')" title="Input / FG">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="#3498db"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7.7 17L12 12.7 16.3 17l1.4-1.4L13.4 11.3l4.3-4.3-1.4-1.4L12 9.9 7.7 5.6 6.3 7l4.3 4.3-4.3 4.3z"/></svg> In/Out
      </button>
      <button class="secondary tool-btn" data-tool="operator" onclick="setMode('operator')" title="Operator">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="#9b59b6"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 7c2.7 0 5.8 1.29 6 4a8 8 0 0 1-12 0c.2-2.71 3.3-4 6-4z"/></svg> Operator
      </button>
      <button class="secondary tool-btn" data-tool="next_process" onclick="setMode('next_process')" title="Next Process">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="#1abc9c"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg> Next
      </button>
    </div>

    <!-- Scale & Grid Controls -->
    <div id="scale-container">
      <label>Scale:</label>
      <input type="number" id="scaleRatio" value="1" min="0.1" step="0.5" style="width:45px;">
      <select id="scaleUnit">
        <option value="m" selected>m</option>
        <option value="ft">ft</option>
        <option value="mm">mm</option>
      </select>
      <label style="margin-left:4px;">Grid:</label>
      <input type="number" id="gridPx" value="40" min="10" max="100" step="5" style="width:45px;">
      <label style="text-transform:none;"><input type="checkbox" id="snapGrid" checked> Snap</label>
      <div class="info-badge" id="scaleDisplay">1 Sq = 1.00 m</div>
      <button class="danger" onclick="clearCanvas()">Clear</button>
    </div>
  </div>

  <div id="app-body">
    <!-- LHS VERTICAL DRAWING TOOLBAR WITH MEASURE BUTTON -->
    <div id="left-toolbar">
      <button class="tool-btn-lhs tool-btn" data-tool="measure" onclick="setMode('measure')" title="Measure Distance & Gap">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M19.5 3.5L20.5 4.5L19 6L20 7L18.5 8.5L17.5 7.5L16 9L17 10L15.5 11.5L14.5 10.5L13 12L14 13L12.5 14.5L11.5 13.5L10 15L11 16L9.5 17.5L8.5 16.5L7 18L8 19L6.5 20.5L3.5 17.5L19.5 3.5Z"/></svg>
      </button>
      <span style="width: 24px; height: 1px; background: #3c3c3c; margin: 2px 0;"></span>
      <button class="tool-btn-lhs tool-btn" data-tool="line" onclick="setMode('line')" title="Line Tool">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M3.5 18.49l14.99-14.99 1.41 1.41L4.91 19.9z"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn" data-tool="arrow" onclick="setMode('arrow')" title="Arrow Line Tool">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M5 13h11.17l-4.88 4.88c-.39.39-.39 1.03 0 1.42.39.39 1.02.39 1.41 0l6.59-6.59c.39-.39.39-1.02 0-1.41l-6.58-6.6c-.39-.39-1.02-.39-1.41 0-.39.39-.39 1.02 0 1.41L16.17 11H5c-.55 0-1 .45-1 1s.45 1 1 1z"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn" data-tool="rectangle" onclick="setMode('rectangle')" title="Rectangle Tool">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M3 5v14h18V5H3zm16 12H5V7h14v10z"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn" data-tool="fillet" onclick="setMode('fillet')" title="Fillet (Rounded Box)">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm12 2H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn" data-tool="circle" onclick="setMode('circle')" title="Circle Tool">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn" data-tool="elbow" onclick="setMode('elbow')" title="Elbow Connector">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M4 4v8h12v8h4v-12H8V4H4z"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn" data-tool="arc" onclick="setMode('arc')" title="Arc Tool">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M19 19h-2c0-4.97-4.03-9-9-9V8c6.08 0 11 4.92 11 11z"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn" data-tool="text" onclick="setMode('text')" title="Text Box">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn" data-tool="dot" onclick="setMode('dot')" title="Dot Marker Tool">
        <svg class="btn-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>
      </button>
      <button class="tool-btn-lhs tool-btn active" data-tool="select" onclick="setMode('select')" title="Select / Move">
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.2L7 19V2z"/></svg>
      </button>
    </div>

    <!-- CANVAS VIEWPORT -->
    <div id="main">
      <div id="canvas-container">
        <canvas id="layoutCanvas" tabindex="0"></canvas>
        <input type="text" id="inline-text-input" placeholder="Type text..." onblur="commitInlineText()" onkeydown="handleTextKey(event)">
        <div class="coord-hud" id="coordHud">X: 0.00m | Y: 0.00m</div>
        <div id="cursor-hud"></div>
      </div>
    </div>

    <!-- RHS VERTICAL FLOWCHART SYMBOLS TOOLBAR -->
    <div id="right-toolbar">
      <div class="rhs-title">Flowchart</div>
      
      <button class="tool-btn-rhs tool-btn" data-tool="parallelogram" onclick="setMode('parallelogram')" title="Input Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#3498db"><polygon points="6,4 22,4 18,20 2,20"/></svg> Input
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="diamond" onclick="setMode('diamond')" title="Decision Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#e74c3c"><polygon points="12,2 22,12 12,22 2,12"/></svg> Decision
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="process_shape" onclick="setMode('process_shape')" title="Process Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#34495e"><rect x="3" y="6" width="18" height="12" rx="1"/></svg> Process
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="merge" onclick="setMode('merge')" title="Merge Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#9b59b6"><polygon points="12,20 2,4 22,4"/></svg> Merge
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="database" onclick="setMode('database')" title="Database Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#f39c12"><path d="M12 2C7 2 3 3.8 3 6v12c0 2.2 4 4 9 4s9-1.8 9-4V6c0-2.2-4-4-9-4zm0 2c3.9 0 7 1.2 7 2s-3.1 2-7 2-7-1.2-7-2 3.1-2 7-2z"/></svg> Database
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="terminal" onclick="setMode('terminal')" title="Terminal Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#1abc9c"><rect x="2" y="6" width="20" height="12" rx="6" ry="6"/></svg> Terminal
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="pill" onclick="setMode('pill')" title="Delay Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#a2d149"><path d="M3,6 H14 A6,6 0 0,1 14,18 H3 Z"/></svg> Delay
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="document_shape" onclick="setMode('document_shape')" title="Document Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#e67e22"><path d="M3 4h18v12c-3-2-6 2-9 0s-6-2-9 0V4z"/></svg> Document
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="multi_document" onclick="setMode('multi_document')" title="Multi-Document Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#d35400"><path d="M3 7h14v10c-2-1.5-4 1.5-7 0s-5-1.5-7 0V7z"/><path d="M6 4h14v10" stroke="#d35400" fill="none"/></svg> Multi-Doc
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="preparation" onclick="setMode('preparation')" title="Preparation Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#8e44ad"><polygon points="6,4 18,4 22,12 18,20 6,20 2,12"/></svg> Preparation
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="end_shape" onclick="setMode('end_shape')" title="End Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#c0392b"><polygon points="3,4 21,4 21,14 12,20 3,14"/></svg> End
      </button>

      <button class="tool-btn-rhs tool-btn" data-tool="manual_input" onclick="setMode('manual_input')" title="Manual Input Shape">
        <svg class="btn-svg-rhs" viewBox="0 0 24 24" fill="#2980b9"><polygon points="3,8 21,4 21,20 3,20"/></svg> Manual Input
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('layoutCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const cursorHud = document.getElementById('cursor-hud');
    const inlineTextInput = document.getElementById('inline-text-input');

    let scaleRatio = 1;      
    let scaleUnit = 'm';     
    let gridPx = 40;         
    let snapToGrid = true;

    let currentMode = 'select'; 
    let shapes = [];
    let selectedShapes = []; 
    let clipboard = [];
    let isDrawing = false;
    let isDragging = false;
    let isRotating = false;
    let isBoxSelecting = false;
    let isPanning = false;

    // Measurement tool states
    let measureStartPoint = null;
    let measureEndPoint = null;
    let activeMeasureInfo = null;
    let measureFirstShape = null;
    let measureSecondShape = null;

    let activeHandle = null; 
    let startX = 0, startY = 0;
    let currentMouseWorld = { x: 0, y: 0 };
    let currentStartPoint = null; 
    let dragOffsets = [];
    const HANDLE_SIZE = 8;
    const ROTATE_HANDLE_OFFSET = 25;

    let panX = 0, panY = 0;
    let zoom = 1;
    let panStartX = 0, panStartY = 0;

    let activeTextShape = null;
    let undoStack = [], redoStack = [];

    const SYMBOL_DEFAULTS = {
      quality:            { strokeColor: '#e74c3c', wPx: 50, hPx: 50, label: 'Quality Check' },
      safety:             { strokeColor: '#2ecc71', wPx: 50, hPx: 50, label: 'Safety' },
      wip:                { strokeColor: '#f39c12', wPx: 60, hPx: 35, label: 'Std WIP' },
      input_fg:           { strokeColor: '#3498db', wPx: 60, hPx: 50, label: 'Input/FG' },
      operator:           { strokeColor: '#9b59b6', wPx: 50, hPx: 50, label: 'Operator' },
      next_process:       { strokeColor: '#1abc9c', wPx: 60, hPx: 40, label: 'Next Process' },
      
      /* Flowchart Shapes */
      parallelogram:      { strokeColor: '#3498db', wPx: 80, hPx: 45, label: 'Input' },
      diamond:            { strokeColor: '#e74c3c', wPx: 60, hPx: 60, label: 'Decision' },
      process_shape:      { strokeColor: '#34495e', wPx: 80, hPx: 45, label: 'Process' },
      merge:              { strokeColor: '#9b59b6', wPx: 60, hPx: 50, label: 'Merge' },
      database:           { strokeColor: '#f39c12', wPx: 60, hPx: 60, label: 'Database' },
      terminal:           { strokeColor: '#1abc9c', wPx: 80, hPx: 40, label: 'Terminal' },
      pill:               { strokeColor: '#a2d149', wPx: 80, hPx: 45, label: 'Delay' },
      document_shape:     { strokeColor: '#e67e22', wPx: 70, hPx: 50, label: 'Document' },
      multi_document:     { strokeColor: '#d35400', wPx: 75, hPx: 55, label: 'Multi-Document' },
      preparation:        { strokeColor: '#8e44ad', wPx: 80, hPx: 45, label: 'Preparation' },
      end_shape:          { strokeColor: '#c0392b', wPx: 60, hPx: 50, label: 'End' },
      manual_input:       { strokeColor: '#2980b9', wPx: 80, hPx: 45, label: 'Manual Input' }
    };

    function copySelected() {
      if (selectedShapes.length === 0) return;
      clipboard = selectedShapes.map(s => {
        const copy = JSON.parse(JSON.stringify(s));
        if (s.type === 'image' && s.imgElement) {
          copy.imgElement = s.imgElement;
        }
        return copy;
      });
    }

    function pasteClipboard() {
      if (clipboard.length === 0) return;
      saveState();

      const offset = gridPx; 
      const newPastedShapes = [];

      clipboard.forEach(item => {
        const pasted = JSON.parse(JSON.stringify(item));
        pasted.x += offset;
        pasted.y += offset;

        if (pasted.type === 'image' && item.imgElement) {
          pasted.imgElement = item.imgElement;
        } else if (pasted.type === 'image' && pasted.src) {
          const img = new Image();
          img.src = pasted.src;
          pasted.imgElement = img;
        }

        shapes.push(pasted);
        newPastedShapes.push(pasted);
      });

      selectedShapes = newPastedShapes;
      
      clipboard.forEach(c => {
        c.x += offset;
        c.y += offset;
      });

      updateEditPanel();
      draw();
    }

    function saveState() {
      const serializableShapes = shapes.map(s => {
        if (s.type === 'image' && s.imgElement) {
          const clone = { ...s };
          delete clone.imgElement;
          return clone;
        }
        return s;
      });
      undoStack.push(JSON.stringify(serializableShapes));
      redoStack = []; 
      updateUndoRedoUI();
    }

    function undo() {
      if (undoStack.length > 0) {
        redoStack.push(JSON.stringify(shapes));
        restoreShapes(JSON.parse(undoStack.pop()));
      }
    }

    function redo() {
      if (redoStack.length > 0) {
        undoStack.push(JSON.stringify(shapes));
        restoreShapes(JSON.parse(redoStack.pop()));
      }
    }

    function restoreShapes(parsedShapes) {
      shapes = parsedShapes;
      shapes.forEach(s => {
        if (s.type === 'image' && s.src) {
          const img = new Image();
          img.src = s.src;
          img.onload = () => draw();
          s.imgElement = img;
        }
      });
      selectedShapes = [];
      updateEditPanel();
      updateUndoRedoUI();
      draw();
    }

    function updateUndoRedoUI() {
      document.getElementById('undoBtn').disabled = undoStack.length === 0;
      document.getElementById('redoBtn').disabled = redoStack.length === 0;
    }

    async function saveProjectJson() {
      const serializableShapes = shapes.map(s => {
        if (s.type === 'image' && s.imgElement) {
          const clone = { ...s };
          delete clone.imgElement;
          return clone;
        }
        return s;
      });

      const jsonStr = JSON.stringify(serializableShapes, null, 2);

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'cad_layout_project.json',
            types: [{ description: 'JSON Project File', accept: { 'application/json': ['.json'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(jsonStr);
          await writable.close();
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonStr);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "cad_layout_project.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerJsonImport() {
      document.getElementById('jsonLoader').click();
    }

    function handleJsonImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const parsed = JSON.parse(event.target.result);
          if (!Array.isArray(parsed)) {
            alert('Invalid project file structure.');
            return;
          }
          saveState();
          restoreShapes(parsed);
          alert('Project loaded successfully!');
        } catch (err) {
          alert('Error parsing the JSON project file.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function createNewPage() {
      if (shapes.length > 0 && !confirm('Create new layout? Unsaved work will be cleared.')) return;
      saveState();
      shapes = [];
      selectedShapes = [];
      updateEditPanel();
      draw();
    }

    function triggerImageUpload() {
      document.getElementById('imageLoader').click();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          saveState();
          const w = img.width > 200 ? 200 : img.width;
          const h = img.width > 200 ? (img.height * (200 / img.width)) : img.height;
          const newShape = {
            type: 'image',
            x: snap(-panX / zoom + 100),
            y: snap(-panY / zoom + 100),
            w: w, h: h,
            src: event.target.result,
            imgElement: img, rotation: 0
          };
          shapes.push(newShape);
          selectedShapes = [newShape];
          updateEditPanel();
          draw();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    async function exportToPDF() {
      if (shapes.length === 0) { alert("Canvas is empty!"); return; }
      const { jsPDF } = window.jspdf;
      const printCanvas = document.createElement('canvas');
      printCanvas.width = canvas.width * 2;
      printCanvas.height = canvas.height * 2;
      const pCtx = printCanvas.getContext('2d');
      pCtx.scale(2, 2);
      pCtx.fillStyle = '#ffffff';
      pCtx.fillRect(0, 0, canvas.width, canvas.height);

      shapes.forEach(s => {
        pCtx.save();
        pCtx.strokeStyle = s.strokeColor || '#000000'; 
        pCtx.lineWidth = s.lineWidth || 2;
        if (s.lineStyle === 'dashed') pCtx.setLineDash([6, 4]);

        const cx = s.x + s.w / 2;
        const cy = s.y + s.h / 2;
        if (s.rotation) {
          pCtx.translate(cx, cy);
          pCtx.rotate((s.rotation * Math.PI) / 180);
          pCtx.translate(-cx, -cy);
        }

        const x = s.x, y = s.y, w = s.w, h = s.h;

        if (s.type === 'text') {
          pCtx.fillStyle = s.strokeColor || '#000000';
          pCtx.font = `${s.fontSize || 16}px sans-serif`;
          pCtx.fillText(s.label !== undefined ? s.label : 'Text', x, y + 15);

        } else if (s.type === 'dot') {
          pCtx.fillStyle = s.strokeColor || '#000000';
          pCtx.beginPath();
          pCtx.arc(x, y, s.radius || 6, 0, Math.PI * 2);
          pCtx.fill();

        } else if (s.type === 'image' && s.imgElement) {
          pCtx.drawImage(s.imgElement, x, y, w, h);

        } else if (s.type === 'rectangle' || s.type === 'fillet' || s.type === 'process_shape') {
          const r = (s.type === 'fillet' || s.radius) ? Math.min(s.radius || 12, Math.abs(w)/2, Math.abs(h)/2) : 0;
          pCtx.beginPath();
          if (r > 0 && pCtx.roundRect) pCtx.roundRect(x, y, w, h, r);
          else pCtx.rect(x, y, w, h);
          pCtx.stroke();
          if(s.type === 'process_shape') renderPdfLabel(pCtx, s);

        } else if (s.type === 'pill') {
          pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.lineTo(x + w - h / 2, y);
          pCtx.arc(x + w - h / 2, y + h / 2, h / 2, -Math.PI / 2, Math.PI / 2, false);
          pCtx.lineTo(x, y + h); pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'diamond') {
          pCtx.beginPath(); pCtx.moveTo(x + w / 2, y); pCtx.lineTo(x + w, y + h / 2);
          pCtx.lineTo(x + w / 2, y + h); pCtx.lineTo(x, y + h / 2); pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'parallelogram') {
          const shift = w * 0.25;
          pCtx.beginPath(); pCtx.moveTo(x + shift, y); pCtx.lineTo(x + w, y);
          pCtx.lineTo(x + w - shift, y + h); pCtx.lineTo(x, y + h); pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'merge') {
          pCtx.beginPath(); pCtx.moveTo(x + w / 2, y + h); pCtx.lineTo(x, y); pCtx.lineTo(x + w, y); pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'database') {
          pCtx.beginPath(); pCtx.ellipse(x + w/2, y + h*0.2, w/2, h*0.15, 0, 0, Math.PI*2); pCtx.stroke();
          pCtx.beginPath(); pCtx.moveTo(x, y + h*0.2); pCtx.lineTo(x, y + h*0.8); pCtx.ellipse(x + w/2, y + h*0.8, w/2, h*0.15, 0, 0, Math.PI, false); pCtx.lineTo(x + w, y + h*0.2); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'terminal') {
          const r = Math.min(Math.abs(w), Math.abs(h)) / 2;
          pCtx.beginPath();
          if (pCtx.roundRect) pCtx.roundRect(x, y, w, h, r);
          else pCtx.rect(x, y, w, h);
          pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'document_shape') {
          pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.lineTo(x + w, y); pCtx.lineTo(x + w, y + h * 0.8);
          pCtx.bezierCurveTo(x + w * 0.75, y + h * 0.6, x + w * 0.25, y + h * 1.1, x, y + h * 0.8);
          pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'multi_document') {
          pCtx.beginPath(); pCtx.moveTo(x + 8, y); pCtx.lineTo(x + w, y); pCtx.lineTo(x + w, y + h * 0.7); pCtx.stroke();
          pCtx.beginPath(); pCtx.moveTo(x + 4, y + 4); pCtx.lineTo(x + w - 4, y + 4); pCtx.lineTo(x + w - 4, y + h * 0.75); pCtx.stroke();
          pCtx.beginPath(); pCtx.moveTo(x, y + 8); pCtx.lineTo(x + w - 8, y + 8); pCtx.lineTo(x + w - 8, y + h * 0.7);
          pCtx.bezierCurveTo(x + (w - 8) * 0.75, y + h * 0.5, x + (w - 8) * 0.25, y + h, x, y + h * 0.8);
          pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'preparation') {
          const side = w * 0.2;
          pCtx.beginPath(); pCtx.moveTo(x + side, y); pCtx.lineTo(x + w - side, y); pCtx.lineTo(x + w, y + h / 2);
          pCtx.lineTo(x + w - side, y + h); pCtx.lineTo(x + side, y + h); pCtx.lineTo(x, y + h / 2); pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'end_shape') {
          pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.lineTo(x + w, y); pCtx.lineTo(x + w, y + h * 0.7);
          pCtx.lineTo(x + w / 2, y + h); pCtx.lineTo(x, y + h * 0.7); pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'manual_input') {
          pCtx.beginPath(); pCtx.moveTo(x, y + h * 0.25); pCtx.lineTo(x + w, y); pCtx.lineTo(x + w, y + h); pCtx.lineTo(x, y + h); pCtx.closePath(); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'circle') {
          pCtx.beginPath(); pCtx.ellipse(x + w/2, y + h/2, Math.abs(w/2), Math.abs(h/2), 0, 0, Math.PI * 2); pCtx.stroke();

        } else if (s.type === 'line' || s.type === 'arrow') {
          pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.lineTo(x + w, y + h); pCtx.stroke();
          if (s.type === 'arrow') {
            const angle = Math.atan2(h, w);
            const headlen = 10;
            pCtx.beginPath(); pCtx.moveTo(x + w, y + h);
            pCtx.lineTo(x + w - headlen * Math.cos(angle - Math.PI / 6), y + h - headlen * Math.sin(angle - Math.PI / 6));
            pCtx.lineTo(x + w - headlen * Math.cos(angle + Math.PI / 6), y + h - headlen * Math.sin(angle + Math.PI / 6));
            pCtx.closePath(); pCtx.fillStyle = s.strokeColor || '#000000'; pCtx.fill();
          }

        } else if (s.type === 'elbow') {
          pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.lineTo(x + w / 2, y); pCtx.lineTo(x + w / 2, y + h); pCtx.lineTo(x + w, y + h); pCtx.stroke();

        } else if (s.type === 'arc') {
          pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.quadraticCurveTo(x + w, y, x + w, y + h); pCtx.stroke();

        } else if (s.type === 'quality') {
          pCtx.beginPath(); pCtx.moveTo(x + w/2, y); pCtx.lineTo(x + w, y + h/2); pCtx.lineTo(x + w/2, y + h); pCtx.lineTo(x, y + h/2);
          pCtx.closePath(); pCtx.stroke(); renderPdfLabel(pCtx, s);

        } else if (s.type === 'safety') {
          const w3 = w / 3, h3 = h / 3;
          pCtx.beginPath(); pCtx.moveTo(x + w3, y); pCtx.lineTo(x + 2 * w3, y); pCtx.lineTo(x + 2 * w3, y + h3);
          pCtx.lineTo(x + w, y + h3); pCtx.lineTo(x + w, y + 2 * h3); pCtx.lineTo(x + 2 * w3, y + 2 * h3);
          pCtx.lineTo(x + 2 * w3, y + h); pCtx.lineTo(x + w3, y + h); pCtx.lineTo(x + w3, y + 2 * h3);
          pCtx.lineTo(x, y + 2 * h3); pCtx.lineTo(x, y + h3); pCtx.lineTo(x + w3, y + h3);
          pCtx.closePath(); pCtx.stroke(); renderPdfLabel(pCtx, s);

        } else if (s.type === 'wip') {
          pCtx.beginPath(); pCtx.ellipse(x + w / 2, y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2); pCtx.stroke();
          pCtx.save(); pCtx.beginPath(); pCtx.ellipse(x + w / 2, y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2); pCtx.clip();
          const lineSpacing = 10;
          pCtx.beginPath();
          for (let offset = -Math.max(w, h) * 2; offset < Math.max(w, h) * 2; offset += lineSpacing) {
            pCtx.moveTo(x + offset, y + h * 2); pCtx.lineTo(x + offset + w * 2, y - h);
          }
          pCtx.stroke(); pCtx.restore(); renderPdfLabel(pCtx, s);

        } else if (s.type === 'input_fg') {
          pCtx.beginPath(); pCtx.rect(x, y, w, h); pCtx.stroke();
          pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.lineTo(x + w, y + h); pCtx.moveTo(x + w, y); pCtx.lineTo(x, y + h); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'operator') {
          const cxP = x + w / 2, cyP = y + h / 2, r = Math.min(Math.abs(w), Math.abs(h)) / 3;
          pCtx.beginPath(); pCtx.arc(cxP, cyP, r, 0, Math.PI * 2); pCtx.stroke();
          pCtx.beginPath(); pCtx.arc(cxP, cyP + r * 0.2, r * 1.5, 0.1 * Math.PI, 0.9 * Math.PI, false); pCtx.stroke();
          pCtx.beginPath(); pCtx.arc(cxP, cyP - r * 0.2, r * 0.5, 0, Math.PI * 2); pCtx.stroke();
          renderPdfLabel(pCtx, s);

        } else if (s.type === 'next_process') {
          const ah = h / 3, aw = w / 3;
          pCtx.beginPath(); pCtx.moveTo(x, y + ah); pCtx.lineTo(x + 2 * aw, y + ah); pCtx.lineTo(x + 2 * aw, y);
          pCtx.lineTo(x + w, y + h / 2); pCtx.lineTo(x + 2 * aw, y + h); pCtx.lineTo(x + 2 * aw, y + 2 * ah);
          pCtx.lineTo(x, y + 2 * ah); pCtx.closePath(); pCtx.stroke(); renderPdfLabel(pCtx, s);
        }

        pCtx.restore();
      });

      const pdf = new jsPDF('landscape', 'pt', 'a4');
      const imgData = printCanvas.toDataURL('image/png');
      pdf.addImage(imgData, 'PNG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
      
      const pdfBlob = pdf.output('blob');
      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'Standard_Work_Layout.pdf',
            types: [{ description: 'PDF Document', accept: { 'application/pdf': ['.pdf'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(pdfBlob);
          await writable.close();
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      pdf.save('Standard_Work_Layout.pdf');
    }

    function renderPdfLabel(pCtx, s) {
      pCtx.fillStyle = '#000000';
      pCtx.font = '11px sans-serif';
      pCtx.textAlign = 'center';
      pCtx.fillText(s.label !== undefined ? s.label : s.type, s.x + s.w / 2, s.y - 6);
    }

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    document.getElementById('scaleRatio').addEventListener('change', (e) => { scaleRatio = parseFloat(e.target.value) || 1; updateScaleDisplay(); updateEditPanel(); draw(); });
    document.getElementById('scaleUnit').addEventListener('change', (e) => { scaleUnit = e.target.value; updateScaleDisplay(); updateEditPanel(); draw(); });
    document.getElementById('gridPx').addEventListener('change', (e) => { gridPx = parseInt(e.target.value) || 40; updateScaleDisplay(); updateEditPanel(); draw(); });
    document.getElementById('snapGrid').addEventListener('change', (e) => { snapToGrid = e.target.checked; });

    function updateScaleDisplay() {
      document.getElementById('scaleDisplay').innerText = `1 Sq = ${scaleRatio.toFixed(2)} ${scaleUnit}`;
    }

    function setMode(mode) {
      finishDrawing();
      currentMode = mode;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === mode);
      });
      canvas.style.cursor = mode === 'pan' ? 'grab' : (mode === 'measure' ? 'copy' : 'crosshair');
    }

    /* Helper: Finish command and switch mode back to Select */
    function finishDrawing() {
      isDrawing = false;
      isDragging = false;
      isRotating = false;
      isBoxSelecting = false;
      isPanning = false;
      currentStartPoint = null;
      measureStartPoint = null;
      measureEndPoint = null;
      activeMeasureInfo = null;
      measureFirstShape = null;
      measureSecondShape = null;
      updateCursorHud(0, 0, null);
    }

    function clearCanvas() {
      if (confirm('Clear drawing?')) {
        saveState();
        shapes = [];
        selectedShapes = [];
        updateEditPanel();
        draw();
      }
    }

    function snap(val) { return snapToGrid ? Math.round(val / gridPx) * gridPx : val; }
    function pxToUnit(px) { return ((Math.abs(px) / gridPx) * scaleRatio).toFixed(2); }
    function unitToPx(units) { return (units / scaleRatio) * gridPx; }

    function getShapeCenter(s) {
      if (s.type === 'dot') return { x: s.x, y: s.y };
      return { x: s.x + (s.w || 0) / 2, y: s.y + (s.h || 0) / 2 };
    }

    function getShapeBoundingBox(s) {
      if (s.type === 'dot') {
        const r = s.radius || 6;
        return { minX: s.x - r, maxX: s.x + r, minY: s.y - r, maxY: s.y + r };
      }
      const minX = Math.min(s.x, s.x + (s.w || 0));
      const maxX = Math.max(s.x, s.x + (s.w || 0));
      const minY = Math.min(s.y, s.y + (s.h || 0));
      const maxY = Math.max(s.y, s.y + (s.h || 0));
      return { minX, maxX, minY, maxY };
    }

    function computeGapAndCenterDistance(s1, s2) {
      const c1 = getShapeCenter(s1);
      const c2 = getShapeCenter(s2);
      const centerDistPx = Math.hypot(c2.x - c1.x, c2.y - c1.y);

      const b1 = getShapeBoundingBox(s1);
      const b2 = getShapeBoundingBox(s2);

      const dx = Math.max(0, b1.minX - b2.maxX, b2.minX - b1.maxX);
      const dy = Math.max(0, b1.minY - b2.maxY, b2.minY - b1.maxX);
      const edgeGapPx = Math.hypot(dx, dy);

      return {
        centerDist: pxToUnit(centerDistPx),
        edgeGap: pxToUnit(edgeGapPx),
        c1, c2, b1, b2
      };
    }

    function toWorldCoords(screenX, screenY) {
      return { x: (screenX - panX) / zoom, y: (screenY - panY) / zoom };
    }

    function toScreenCoords(worldX, worldY) {
      return { x: worldX * zoom + panX, y: worldY * zoom + panY };
    }

    function getShapeDisplayType(shape) {
      if (!shape) return '';
      if (SYMBOL_DEFAULTS[shape.type]) return shape.type;
      return shape.type;
    }

    function updateEditPanel() {
      const panel = document.getElementById('editPanel');
      
      if (activeMeasureInfo) {
        panel.innerHTML = `<span style="color:#00ffcc; font-size:0.75rem; font-weight:bold;">MEASUREMENT:</span>
          <span style="font-size:0.75rem; color:#fff;">${activeMeasureInfo}</span>`;
        return;
      }

      if (selectedShapes.length === 0) {
        panel.innerHTML = `<span style="font-size:0.75rem; color:#888;">No Selection</span>`;
        return;
      }
      
      if (selectedShapes.length > 1) {
        panel.innerHTML = `<span style="color:#00ffcc; font-size:0.75rem; font-weight:bold;">${selectedShapes.length} Selected</span>
          <button class="danger" onclick="deleteSelected()" style="padding:2px 6px;">Del All</button>`;
        return;
      }

      const selectedShape = selectedShapes[0];
      const displayType = getShapeDisplayType(selectedShape);
      let html = `<span style="color:#00ffcc; font-size:0.75rem; font-weight:bold;">${displayType.toUpperCase()}:</span>`;
      
      if (selectedShape.type !== 'image') {
        html += `<label>Text</label><input type="text" id="editLabel" value="${selectedShape.label !== undefined ? selectedShape.label : ''}" style="width:70px;">`;
        html += `<label>Color</label><input type="color" id="editColor" value="${selectedShape.strokeColor || '#ffffff'}" style="width:28px; padding:1px;">`;
        if (selectedShape.type !== 'dot') {
          html += `<label>Thick</label><input type="number" id="editLineWidth" value="${selectedShape.lineWidth || 2}" min="1" max="20" style="width:38px;">`;
          html += `<label>Style</label><select id="editLineStyle" style="height:26px;">
              <option value="solid" ${selectedShape.lineStyle === 'dashed' ? '' : 'selected'}>Solid</option>
              <option value="dashed" ${selectedShape.lineStyle === 'dashed' ? 'selected' : ''}>Dashed</option>
            </select>`;
        }
      }

      if (['rectangle', 'fillet'].includes(selectedShape.type)) {
        html += `<label>Fillet/Rad</label><input type="number" id="editRadius" value="${selectedShape.radius || 0}" min="0" max="100" style="width:42px;">`;
      }

      if (selectedShape.type === 'circle' || selectedShape.type === 'dot') {
        const rad = selectedShape.type === 'dot' ? (selectedShape.radius || 6) : Math.abs(selectedShape.w / 2);
        html += `<label>Radius</label><input type="number" id="editRadius" value="${pxToUnit(rad)}" step="0.1" style="width:45px;">`;
      } else {
        html += `<label>Rot°</label><input type="number" id="editRotation" value="${selectedShape.rotation || 0}" min="0" max="360" style="width:42px;">`;
      }

      if (selectedShape.type === 'text') {
        html += `<label>Font</label><input type="number" id="editFontSize" value="${selectedShape.fontSize || 16}" min="8" max="72" style="width:42px;">`;
      } else if (selectedShape.type !== 'dot' && selectedShape.type !== 'circle') {
        html += `<label>W</label><input type="number" id="editWidth" value="${pxToUnit(selectedShape.w)}" step="0.1" style="width:45px;">`;
        html += `<label>H</label><input type="number" id="editHeight" value="${pxToUnit(selectedShape.h)}" step="0.1" style="width:45px;">`;
      }

      html += `<button class="danger" onclick="deleteSelected()" style="padding:2px 6px;">Del</button>`;
      panel.innerHTML = html;

      if (document.getElementById('editLabel')) {
        document.getElementById('editLabel').addEventListener('input', (e) => { selectedShape.label = e.target.value; draw(); });
      }
      if (document.getElementById('editColor')) {
        document.getElementById('editColor').addEventListener('input', (e) => { selectedShape.strokeColor = e.target.value; draw(); });
      }
      if (document.getElementById('editLineWidth')) {
        document.getElementById('editLineWidth').addEventListener('change', (e) => { saveState(); selectedShape.lineWidth = parseInt(e.target.value) || 2; draw(); });
      }
      if (document.getElementById('editLineStyle')) {
        document.getElementById('editLineStyle').addEventListener('change', (e) => { saveState(); selectedShape.lineStyle = e.target.value; draw(); });
      }

      if (document.getElementById('editRadius')) {
        document.getElementById('editRadius').addEventListener('change', (e) => {
          saveState(); 
          if (selectedShape.type === 'dot') {
            selectedShape.radius = Math.max(1, parseInt(e.target.value) || 6);
          } else if (selectedShape.type === 'circle') {
            const rPx = unitToPx(parseFloat(e.target.value) || 1);
            selectedShape.w = rPx * 2;
            selectedShape.h = rPx * 2;
          } else {
            selectedShape.radius = Math.max(0, parseInt(e.target.value) || 0); 
            if(selectedShape.radius > 0 && selectedShape.type === 'rectangle') selectedShape.type = 'fillet';
          }
          draw(); 
        });
      }

      if (document.getElementById('editRotation')) {
        document.getElementById('editRotation').addEventListener('change', (e) => {
          saveState();
          let deg = parseInt(e.target.value) || 0;
          selectedShape.rotation = (deg % 360 + 360) % 360;
          draw();
        });
      }

      if (document.getElementById('editFontSize')) {
        document.getElementById('editFontSize').addEventListener('change', (e) => { selectedShape.fontSize = parseInt(e.target.value) || 16; draw(); });
      }

      if (document.getElementById('editWidth')) {
        document.getElementById('editWidth').addEventListener('change', (e) => {
          saveState();
          const val = parseFloat(e.target.value) || 0.1;
          const newPx = unitToPx(val);
          selectedShape.w = selectedShape.w < 0 ? -newPx : newPx;
          draw();
        });
      }

      if (document.getElementById('editHeight')) {
        document.getElementById('editHeight').addEventListener('change', (e) => {
          saveState();
          const val = parseFloat(e.target.value) || 0.1;
          const newPx = unitToPx(val);
          selectedShape.h = selectedShape.h < 0 ? -newPx : newPx;
          draw();
        });
      }
    }

    function deleteSelected() {
      if (selectedShapes.length > 0) {
        saveState();
        shapes = shapes.filter(s => !selectedShapes.includes(s));
        selectedShapes = [];
        updateEditPanel();
        draw();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        setMode('select');
        selectedShapes = [...shapes];
        updateEditPanel();
        draw();
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        copySelected();
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
        e.preventDefault();
        pasteClipboard();
        return;
      }

      if (e.key === 'Escape') { setMode('select'); return; }
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') { if (e.shiftKey) redo(); else undo(); e.preventDefault(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key === 'y') { redo(); e.preventDefault(); return; }

      if (e.key === 'Delete' || e.key === 'Backspace') { 
        if (selectedShapes.length > 0) { deleteSelected(); e.preventDefault(); return; }
      }

      const panStep = e.shiftKey ? 50 : 20;
      if (selectedShapes.length === 0 || currentMode === 'pan') {
        if (e.key === 'ArrowLeft') { panX += panStep; draw(); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { panX -= panStep; draw(); e.preventDefault(); }
        else if (e.key === 'ArrowUp') { panY += panStep; draw(); e.preventDefault(); }
        else if (e.key === 'ArrowDown') { panY -= panStep; draw(); e.preventDefault(); }
      } else if (selectedShapes.length === 1) {
        const s = selectedShapes[0];
        const step = e.shiftKey ? 1 : gridPx;
        let moved = false;

        if (e.key === 'ArrowLeft') { s.x -= step; moved = true; }
        else if (e.key === 'ArrowRight') { s.x += step; moved = true; }
        else if (e.key === 'ArrowUp') { s.y -= step; moved = true; }
        else if (e.key === 'ArrowDown') { s.y += step; moved = true; }

        if (moved) { e.preventDefault(); updateEditPanel(); draw(); }
      }
    });

    function transformPoint(x, y, cx, cy, angleDeg) {
      const rad = (angleDeg * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const nx = cos * (x - cx) - sin * (y - cy) + cx;
      const ny = sin * (x - cx) + cos * (y - cy) + cy;
      return { x: nx, y: ny };
    }

    function getRotateHandlePos(s) {
      const cx = s.x + s.w / 2;
      const cy = s.y + s.h / 2;
      const topX = cx;
      const topY = s.y - ROTATE_HANDLE_OFFSET;
      return transformPoint(topX, topY, cx, cy, s.rotation || 0);
    }

    function getHandles(s) {
      if (!s) return [];
      const cx = s.x + s.w / 2;
      const cy = s.y + s.h / 2;
      const rot = s.rotation || 0;

      const raw = [
        { name: 'tl', x: s.x, y: s.y, cursor: 'nwse-resize' },
        { name: 'tr', x: s.x + s.w, y: s.y, cursor: 'nesw-resize' },
        { name: 'br', x: s.x + s.w, y: s.y + s.h, cursor: 'nwse-resize' },
        { name: 'bl', x: s.x, y: s.y + s.h, cursor: 'nesw-resize' }
      ];

      return raw.map(h => {
        const pt = transformPoint(h.x, h.y, cx, cy, rot);
        return { name: h.name, x: pt.x, y: pt.y, cursor: h.cursor };
      });
    }

    function getHandleAtPoint(x, y, shape) {
      if (shape.type === 'dot') return null;
      const rotPt = getRotateHandlePos(shape);
      if (Math.hypot(x - rotPt.x, y - rotPt.y) <= (HANDLE_SIZE + 4) / zoom) {
        return { name: 'rotate', x: rotPt.x, y: rotPt.y, cursor: 'grab' };
      }

      const handles = getHandles(shape);
      for (let h of handles) {
        if (Math.hypot(x - h.x, y - h.y) <= (HANDLE_SIZE + 4) / zoom) return h;
      }
      return null;
    }

    function updateCursorHud(mouseX, mouseY, text) {
      if (!text) { cursorHud.style.display = 'none'; return; }
      cursorHud.style.display = 'block';
      cursorHud.innerText = text;
      cursorHud.style.left = (mouseX + 15) + 'px';
      cursorHud.style.top = (mouseX + 15) + 'px';
    }

    function openInlineTextInput(shape, screenPt) {
      activeTextShape = shape;
      inlineTextInput.value = shape.label !== undefined ? shape.label : '';
      inlineTextInput.style.left = screenPt.x + 'px';
      inlineTextInput.style.top = screenPt.y + 'px';
      inlineTextInput.style.display = 'block';
      setTimeout(() => inlineTextInput.focus(), 50);
    }

    function commitInlineText() {
      if (activeTextShape) {
        saveState();
        activeTextShape.label = inlineTextInput.value;
        activeTextShape = null;
        inlineTextInput.style.display = 'none';
        updateEditPanel();
        draw();
      }
    }

    function handleTextKey(e) {
      if (e.key === 'Enter') commitInlineText();
      else if (e.key === 'Escape') { activeTextShape = null; inlineTextInput.style.display = 'none'; }
    }

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * zoomFactor;
      panY = mouseY - (mouseY - panY) * zoomFactor;
      zoom *= zoomFactor;
      draw();
    }, { passive: false });

    canvas.addEventListener('dblclick', (e) => {
      if (e.button === 0) {
        setMode('select');
      }
    });

    /* Right-click finishes command & switches mode to Select */
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      finishDrawing();
      setMode('select');
      updateEditPanel();
      draw();
    });

    canvas.addEventListener('mousedown', (e) => {
      canvas.focus();
      const rect = canvas.getBoundingClientRect();
      const screenX = e.clientX - rect.left;
      const screenY = e.clientY - rect.top;
      const wPt = toWorldCoords(screenX, screenY);

      if (e.button === 1 || currentMode === 'pan') { 
        isPanning = true;
        panStartX = e.clientX - panX;
        panStartY = e.clientY - panY;
        canvas.style.cursor = 'grabbing';
        return;
      }

      /* Enhanced Measure Mode Logic: Two Entities Gap / Center-to-Center & Custom Points */
      if (currentMode === 'measure') {
        const hitShapes = shapes.filter(s => isPointInShape(wPt.x, wPt.y, s));
        
        if (hitShapes.length > 0) {
          hitShapes.sort((a, b) => getShapeArea(a) - getShapeArea(b));
          const clickedEntity = hitShapes[0];

          if (!measureFirstShape) {
            measureFirstShape = clickedEntity;
            selectedShapes = [clickedEntity];
            
            if (clickedEntity.type === 'circle') {
              const rad = pxToUnit(Math.abs(clickedEntity.w / 2));
              const dia = pxToUnit(Math.abs(clickedEntity.w));
              activeMeasureInfo = `Circle R: ${rad}${scaleUnit} | Dia: ${dia}${scaleUnit} (Click 2nd shape to measure gap)`;
            } else if (clickedEntity.type === 'line' || clickedEntity.type === 'arrow') {
              const len = pxToUnit(Math.hypot(clickedEntity.w, clickedEntity.h));
              activeMeasureInfo = `Length: ${len}${scaleUnit} (Click 2nd shape to measure gap)`;
            } else {
              const wUnit = pxToUnit(clickedEntity.w || 0);
              const hUnit = pxToUnit(clickedEntity.h || 0);
              activeMeasureInfo = `W: ${wUnit}${scaleUnit} × H: ${hUnit}${scaleUnit} (Click 2nd shape for C-to-C & Gap)`;
            }
          } else if (measureFirstShape !== clickedEntity) {
            measureSecondShape = clickedEntity;
            selectedShapes = [measureFirstShape, measureSecondShape];

            const res = computeGapAndCenterDistance(measureFirstShape, measureSecondShape);
            activeMeasureInfo = `Center-to-Center: ${res.centerDist}${scaleUnit} | Gap: ${res.edgeGap}${scaleUnit}`;

            measureFirstShape = null;
            measureSecondShape = null;
          } else {
            measureFirstShape = null;
            selectedShapes = [];
            activeMeasureInfo = null;
          }

          updateEditPanel();
          draw();
          return;
        }

        // Point to Point Measurement fallback
        if (!measureStartPoint) {
          measureFirstShape = null;
          measureSecondShape = null;
          selectedShapes = [];
          measureStartPoint = { x: snap(wPt.x), y: snap(wPt.y) };
          activeMeasureInfo = "Click second point to finish measure";
          updateEditPanel();
        } else {
          measureEndPoint = { x: snap(wPt.x), y: snap(wPt.y) };
          const distPx = Math.hypot(measureEndPoint.x - measureStartPoint.x, measureEndPoint.y - measureStartPoint.y);
          const distUnit = pxToUnit(distPx);
          activeMeasureInfo = `Distance: ${distUnit}${scaleUnit} (dX: ${pxToUnit(measureEndPoint.x - measureStartPoint.x)}${scaleUnit}, dY: ${pxToUnit(measureEndPoint.y - measureStartPoint.y)}${scaleUnit})`;
          measureStartPoint = null;
          measureEndPoint = null;
          updateEditPanel();
        }
        draw();
        return;
      }

      if (selectedShapes.length === 1) {
        const handle = getHandleAtPoint(wPt.x, wPt.y, selectedShapes[0]);
        if (handle) {
          saveState();
          if (handle.name === 'rotate') isRotating = true;
          else activeHandle = handle.name;
          return;
        }
      }

      if (currentMode === 'text') {
        saveState();
        const sX = snap(wPt.x);
        const sY = snap(wPt.y);
        const newShape = {
          type: 'text',
          x: sX, y: sY, w: 120, h: 30,
          strokeColor: '#ffffff', label: '', fontSize: 16, rotation: 0
        };
        shapes.push(newShape);
        selectedShapes = [newShape];
        openInlineTextInput(newShape, toScreenCoords(sX, sY));
        setMode('select');
        return;
      }

      if (currentMode === 'dot') {
        saveState();
        const sX = snap(wPt.x);
        const sY = snap(wPt.y);
        const newShape = {
          type: 'dot',
          x: sX, y: sY, radius: 6,
          strokeColor: '#ffffff', label: 'Dot'
        };
        shapes.push(newShape);
        selectedShapes = [newShape];
        updateEditPanel();
        draw();
        return;
      }

      if (currentMode !== 'select') {
        saveState();
        startX = snap(wPt.x);
        startY = snap(wPt.y);
        currentStartPoint = { x: startX, y: startY };
        const selectedStyle = document.getElementById('globalLineStyle').value;
        
        if (SYMBOL_DEFAULTS[currentMode]) {
          const def = SYMBOL_DEFAULTS[currentMode];
          const newShape = {
            type: currentMode,
            x: startX, y: startY, w: def.wPx, h: def.hPx,
            strokeColor: def.strokeColor, label: def.label, lineWidth: 2, lineStyle: selectedStyle, rotation: 0, fontSize: 16
          };
          shapes.push(newShape);
          selectedShapes = [newShape];
          currentStartPoint = null;
          updateEditPanel();
          draw();
        } else {
          isDrawing = true;
          let rVal = currentMode === 'fillet' ? 12 : 0;
          const newShape = {
            type: currentMode,
            x: startX, y: startY, w: 0, h: 0, radius: rVal,
            strokeColor: '#00ffcc', lineWidth: 2, lineStyle: selectedStyle, rotation: 0, label: currentMode.toUpperCase()
          };
          selectedShapes = [newShape];
        }
      } else {
        const hitShapes = shapes.filter(s => isPointInShape(wPt.x, wPt.y, s));
        let clickedShape = null;

        if (hitShapes.length > 0) {
          hitShapes.sort((a, b) => getShapeArea(a) - getShapeArea(b));
          clickedShape = hitShapes[0];
        }

        const isMultiKey = e.shiftKey || e.ctrlKey || e.metaKey;

        if (clickedShape) {
          if (isMultiKey) {
            const idx = selectedShapes.indexOf(clickedShape);
            if (idx > -1) {
              selectedShapes.splice(idx, 1);
            } else {
              selectedShapes.push(clickedShape);
            }
          } else {
            if (!selectedShapes.includes(clickedShape)) selectedShapes = [clickedShape];
          }
          isDragging = true;
          dragOffsets = selectedShapes.map(s => ({ x: wPt.x - s.x, y: wPt.y - s.y }));
        } else {
          isBoxSelecting = true;
          startX = wPt.x;
          startY = wPt.y;
          if (!isMultiKey) selectedShapes = [];
        }
        updateEditPanel();
        draw();
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const screenX = e.clientX - rect.left;
      const screenY = e.clientY - rect.top;
      const wPt = toWorldCoords(screenX, screenY);
      currentMouseWorld = wPt;

      if (isPanning) {
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        draw();
        return;
      }

      document.getElementById('coordHud').innerText = `X: ${pxToUnit(wPt.x)}${scaleUnit} | Y: ${pxToUnit(wPt.y)}${scaleUnit}`;

      if (currentMode === 'measure' && measureStartPoint) {
        const curPx = snap(wPt.x);
        const curPy = snap(wPt.y);
        const distPx = Math.hypot(curPx - measureStartPoint.x, curPy - measureStartPoint.y);
        updateCursorHud(screenX, screenY, `Dist: ${pxToUnit(distPx)}${scaleUnit}`);
        draw();
        return;
      }

      if (currentMode === 'measure' && measureFirstShape) {
        const hitShapes = shapes.filter(s => isPointInShape(wPt.x, wPt.y, s) && s !== measureFirstShape);
        if (hitShapes.length > 0) {
          hitShapes.sort((a, b) => getShapeArea(a) - getShapeArea(b));
          const hoverShape = hitShapes[0];
          const res = computeGapAndCenterDistance(measureFirstShape, hoverShape);
          updateCursorHud(screenX, screenY, `C-to-C: ${res.centerDist}${scaleUnit} | Gap: ${res.edgeGap}${scaleUnit}`);
        } else {
          updateCursorHud(screenX, screenY, "Select 2nd Entity");
        }
        draw();
        return;
      }

      if (selectedShapes.length === 1 && !isDragging && !isDrawing && !activeHandle && !isRotating && !isBoxSelecting) {
        const h = getHandleAtPoint(wPt.x, wPt.y, selectedShapes[0]);
        canvas.style.cursor = h ? h.cursor : (isPointInShape(wPt.x, wPt.y, selectedShapes[0]) ? 'move' : (currentMode === 'pan' ? 'grab' : (currentMode === 'measure' ? 'copy' : 'crosshair')));
        updateCursorHud(screenX, screenY, null);
      }

      if (isRotating && selectedShapes.length === 1) {
        const s = selectedShapes[0];
        const cx = s.x + s.w / 2;
        const cy = s.y + s.h / 2;
        let rad = Math.atan2(wPt.y - cy, wPt.x - cx);
        let deg = Math.round((rad * 180) / Math.PI) + 90;
        if (deg < 0) deg += 360;
        s.rotation = deg;
        updateCursorHud(screenX, screenY, `Angle: ${deg}°`);
        updateEditPanel();
        draw();

      } else if (activeHandle && selectedShapes.length === 1) {
        let curX = snap(wPt.x);
        let curY = snap(wPt.y);
        let s = selectedShapes[0];

        if (activeHandle === 'br') {
          s.w = Math.max(10, curX - s.x);
          s.h = Math.max(10, curY - s.y);
        } else if (activeHandle === 'tr') {
          let newH = (s.y + s.h) - curY;
          if (newH > 10) { s.y = curY; s.h = newH; }
          s.w = Math.max(10, curX - s.x);
        } else if (activeHandle === 'bl') {
          let newW = (s.x + s.w) - curX;
          if (newW > 10) { s.x = curX; s.w = newW; }
          s.h = Math.max(10, curY - s.y);
        } else if (activeHandle === 'tl') {
          let newW = (s.x + s.w) - curX;
          let newH = (s.y + s.h) - curY;
          if (newW > 10) { s.x = curX; s.w = newW; }
          if (newH > 10) { s.y = curY; s.h = newH; }
        }
        updateCursorHud(screenX, screenY, `W: ${pxToUnit(s.w)}${scaleUnit} × H: ${pxToUnit(s.h)}${scaleUnit}`);
        updateEditPanel();
        draw();

      } else if (isDrawing && selectedShapes.length === 1) {
        let currentX = snap(wPt.x);
        let currentY = snap(wPt.y);
        const s = selectedShapes[0];

        s.w = currentX - startX;
        s.h = currentY - startY;

        updateCursorHud(screenX, screenY, `${pxToUnit(s.w)}${scaleUnit} × ${pxToUnit(s.h)}${scaleUnit}`);
        draw();

      } else if (isDragging && selectedShapes.length > 0) {
        selectedShapes.forEach((s, idx) => {
          s.x = snap(wPt.x - dragOffsets[idx].x);
          s.y = snap(wPt.y - dragOffsets[idx].y);
        });
        updateCursorHud(screenX, screenY, `X: ${pxToUnit(wPt.x)}${scaleUnit} | Y: ${pxToUnit(wPt.y)}${scaleUnit}`);
        updateEditPanel();
        draw();

      } else if (isBoxSelecting) {
        draw();
        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(zoom, zoom);
        ctx.strokeStyle = '#00aaff';
        ctx.fillStyle = 'rgba(0, 170, 255, 0.15)';
        ctx.lineWidth = 1 / zoom;
        const bx = Math.min(startX, wPt.x);
        const by = Math.min(startY, wPt.y);
        const bw = Math.abs(wPt.x - startX);
        const bh = Math.abs(wPt.y - startY);
        ctx.fillRect(bx, by, bw, bh);
        ctx.strokeRect(bx, by, bw, bh);
        ctx.restore();

      } else {
        updateCursorHud(screenX, screenY, null);
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      const rect = canvas.getBoundingClientRect();
      const screenX = e.clientX - rect.left;
      const screenY = e.clientY - rect.top;
      const wPt = toWorldCoords(screenX, screenY);

      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = currentMode === 'pan' ? 'grab' : 'crosshair';
        return;
      }

      if (isDrawing && selectedShapes.length === 1) {
        const s = selectedShapes[0];
        if (Math.abs(s.w) > 2 || Math.abs(s.h) > 2) {
          s.strokeColor = '#ffffff'; 
          shapes.push(s);
        } else {
          selectedShapes = [];
        }
        isDrawing = false;
        currentStartPoint = null;
        updateEditPanel();
      }

      if (isBoxSelecting) {
        const bx = Math.min(startX, wPt.x);
        const by = Math.min(startY, wPt.y);
        const bw = Math.abs(wPt.x - startX);
        const bh = Math.abs(wPt.y - startY);

        shapes.forEach(s => {
          if (s.x >= bx && s.x + s.w <= bx + bw && s.y >= by && s.y + s.h <= by + bh) {
            if (!selectedShapes.includes(s)) selectedShapes.push(s);
          }
        });

        isBoxSelecting = false;
        updateEditPanel();
      }

      isDragging = false;
      isRotating = false;
      activeHandle = null;
      currentStartPoint = null;
      updateCursorHud(0, 0, null);
      draw();
    });

    function getShapeArea(s) {
      if (s.type === 'dot') return Math.PI * Math.pow(s.radius || 6, 2);
      return Math.abs((s.w || 0) * (s.h || 0));
    }

    function isPointInShape(x, y, s) {
      if (s.type === 'dot') {
        return Math.hypot(x - s.x, y - s.y) <= (s.radius || 6) + 5;
      }

      const cx = s.x + s.w / 2;
      const cy = s.y + s.h / 2;
      const unrot = transformPoint(x, y, cx, cy, -(s.rotation || 0));

      const minX = Math.min(s.x, s.x + s.w);
      const maxX = Math.max(s.x, s.x + s.w);
      const minY = Math.min(s.y, s.y + s.h);
      const maxY = Math.max(s.y, s.y + s.h);
      return unrot.x >= minX - 5 && unrot.x <= maxX + 5 && unrot.y >= minY - 5 && unrot.y <= maxY + 5;
    }

    function drawGrid() {
      ctx.strokeStyle = '#252525';
      ctx.lineWidth = 1 / zoom;
      ctx.setLineDash([]);
      
      const startXWorld = -panX / zoom;
      const startYWorld = -panY / zoom;
      const endXWorld = (canvas.width - panX) / zoom;
      const endYWorld = (canvas.height - panY) / zoom;

      const firstGridX = Math.floor(startXWorld / gridPx) * gridPx;
      const firstGridY = Math.floor(startYWorld / gridPx) * gridPx;

      for (let x = firstGridX; x < endXWorld; x += gridPx) {
        ctx.beginPath(); ctx.moveTo(x, startYWorld); ctx.lineTo(x, endYWorld); ctx.stroke();
      }
      for (let y = firstGridY; y < endYWorld; y += gridPx) {
        ctx.beginPath(); ctx.moveTo(startXWorld, y); ctx.lineTo(endXWorld, y); ctx.stroke();
      }
    }

    function drawShape(s, isPreview = false) {
      ctx.save();
      ctx.fillStyle = 'transparent';
      ctx.strokeStyle = selectedShapes.includes(s) ? '#00ffcc' : (s.strokeColor || '#ffffff');
      
      ctx.lineWidth = (s.lineWidth || 2) / zoom;
      if (s.lineStyle === 'dashed') ctx.setLineDash([8 / zoom, 4 / zoom]);
      else ctx.setLineDash([]);

      const cx = s.x + s.w / 2;
      const cy = s.y + s.h / 2;
      if (s.rotation) {
        ctx.translate(cx, cy);
        ctx.rotate((s.rotation * Math.PI) / 180);
        ctx.translate(-cx, -cy);
      }

      const x = s.x, y = s.y, w = s.w, h = s.h;
      ctx.beginPath();

      if (s.type === 'text') {
        ctx.fillStyle = s.strokeColor || '#ffffff';
        ctx.font = `${s.fontSize || 16}px sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(s.label !== undefined ? s.label : 'Text Note', x, y + 15);

      } else if (s.type === 'dot') {
        ctx.fillStyle = selectedShapes.includes(s) ? '#00ffcc' : (s.strokeColor || '#ffffff');
        ctx.arc(x, y, s.radius || 6, 0, Math.PI * 2);
        ctx.fill();

      } else if (s.type === 'image' && s.imgElement) {
        ctx.drawImage(s.imgElement, x, y, w, h);

      } else if (s.type === 'rectangle' || s.type === 'fillet' || s.type === 'process_shape') {
        const r = (s.type === 'fillet' || s.radius) ? Math.min(s.radius || 12, Math.abs(w)/2, Math.abs(h)/2) : 0;
        if (r > 0 && ctx.roundRect) ctx.roundRect(x, y, w, h, r);
        else ctx.rect(x, y, w, h);
        ctx.stroke();
        if (s.type === 'process_shape') renderLabel(s);

      } else if (s.type === 'pill') {
        ctx.moveTo(x, y);
        ctx.lineTo(x + w - h / 2, y);
        ctx.arc(x + w - h / 2, y + h / 2, h / 2, -Math.PI / 2, Math.PI / 2, false);
        ctx.lineTo(x, y + h);
        ctx.closePath();
        ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'diamond') {
        ctx.moveTo(x + w / 2, y);
        ctx.lineTo(x + w, y + h / 2);
        ctx.lineTo(x + w / 2, y + h);
        ctx.lineTo(x, y + h / 2);
        ctx.closePath();
        ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'parallelogram') {
        const shift = w * 0.25;
        ctx.moveTo(x + shift, y);
        ctx.lineTo(x + w, y);
        ctx.lineTo(x + w - shift, y + h);
        ctx.lineTo(x, y + h);
        ctx.closePath();
        ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'merge') {
        ctx.moveTo(x + w / 2, y + h); ctx.lineTo(x, y); ctx.lineTo(x + w, y); ctx.closePath(); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'database') {
        ctx.ellipse(x + w/2, y + h*0.2, w/2, h*0.15, 0, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y + h*0.2); ctx.lineTo(x, y + h*0.8); ctx.ellipse(x + w/2, y + h*0.8, w/2, h*0.15, 0, 0, Math.PI, false); ctx.lineTo(x + w, y + h*0.2); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'terminal') {
        const r = Math.min(Math.abs(w), Math.abs(h)) / 2;
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
        else ctx.rect(x, y, w, h);
        ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'document_shape') {
        ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h * 0.8);
        ctx.bezierCurveTo(x + w * 0.75, y + h * 0.6, x + w * 0.25, y + h * 1.1, x, y + h * 0.8);
        ctx.closePath(); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'multi_document') {
        ctx.moveTo(x + 8, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h * 0.7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + w - 4, y + 4); ctx.lineTo(x + w - 4, y + h * 0.75); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y + 8); ctx.lineTo(x + w - 8, y + 8); ctx.lineTo(x + w - 8, y + h * 0.7);
        ctx.bezierCurveTo(x + (w - 8) * 0.75, y + h * 0.5, x + (w - 8) * 0.25, y + h, x, y + h * 0.8);
        ctx.closePath(); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'preparation') {
        const side = w * 0.2;
        ctx.moveTo(x + side, y); ctx.lineTo(x + w - side, y); ctx.lineTo(x + w, y + h / 2);
        ctx.lineTo(x + w - side, y + h); ctx.lineTo(x + side, y + h); ctx.lineTo(x, y + h / 2); ctx.closePath(); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'end_shape') {
        ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h * 0.7);
        ctx.lineTo(x + w / 2, y + h); ctx.lineTo(x, y + h * 0.7); ctx.closePath(); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'manual_input') {
        ctx.moveTo(x, y + h * 0.25); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'circle') {
        ctx.ellipse(x + w/2, y + h/2, Math.abs(w/2), Math.abs(h/2), 0, 0, Math.PI * 2); ctx.stroke();

      } else if (s.type === 'line' || s.type === 'arrow') {
        ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.stroke();
        if (s.type === 'arrow') {
          const angle = Math.atan2(h, w);
          const headlen = 10 / zoom;
          ctx.beginPath();
          ctx.moveTo(x + w, y + h);
          ctx.lineTo(x + w - headlen * Math.cos(angle - Math.PI / 6), y + h - headlen * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(x + w - headlen * Math.cos(angle + Math.PI / 6), y + h - headlen * Math.sin(angle + Math.PI / 6));
          ctx.closePath();
          ctx.fillStyle = selectedShapes.includes(s) ? '#00ffcc' : (s.strokeColor || '#ffffff');
          ctx.fill();
        }

      } else if (s.type === 'elbow') {
        ctx.moveTo(x, y); ctx.lineTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h); ctx.lineTo(x + w, y + h); ctx.stroke();

      } else if (s.type === 'arc') {
        ctx.moveTo(x, y); ctx.quadraticCurveTo(x + w, y, x + w, y + h); ctx.stroke();

      } else if (s.type === 'quality') {
        ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w, y + h / 2); ctx.lineTo(x + w / 2, y + h); ctx.lineTo(x, y + h / 2);
        ctx.closePath(); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'safety') {
        const w3 = w / 3, h3 = h / 3;
        ctx.moveTo(x + w3, y); ctx.lineTo(x + 2 * w3, y); ctx.lineTo(x + 2 * w3, y + h3); ctx.lineTo(x + w, y + h3);
        ctx.lineTo(x + w, y + 2 * h3); ctx.lineTo(x + 2 * w3, y + 2 * h3); ctx.lineTo(x + 2 * w3, y + h);
        ctx.lineTo(x + w3, y + h); ctx.lineTo(x + w3, y + 2 * h3); ctx.lineTo(x, y + 2 * h3); ctx.lineTo(x, y + h3);
        ctx.lineTo(x + w3, y + h3);
        ctx.closePath(); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'wip') {
        ctx.ellipse(x + w / 2, y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(x + w / 2, y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2);
        ctx.clip();

        const lineSpacing = 10;
        ctx.beginPath();
        for (let offset = -Math.max(w, h) * 2; offset < Math.max(w, h) * 2; offset += lineSpacing) {
          ctx.moveTo(x + offset, y + h * 2);
          ctx.lineTo(x + offset + w * 2, y - h);
        }
        ctx.stroke();
        ctx.restore();

        renderLabel(s);

      } else if (s.type === 'input_fg') {
        ctx.rect(x, y, w, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.moveTo(x + w, y); ctx.lineTo(x, y + h); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'operator') {
        const cxP = x + w / 2, cyP = y + h / 2, r = Math.min(Math.abs(w), Math.abs(h)) / 3;
        ctx.arc(cxP, cyP, r, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cxP, cyP + r * 0.2, r * 1.5, 0.1 * Math.PI, 0.9 * Math.PI, false); ctx.stroke();
        ctx.beginPath(); ctx.arc(cxP, cyP - r * 0.2, r * 0.5, 0, Math.PI * 2); ctx.stroke();
        renderLabel(s);

      } else if (s.type === 'next_process') {
        const ah = h / 3, aw = w / 3;
        ctx.moveTo(x, y + ah); ctx.lineTo(x + 2 * aw, y + ah); ctx.lineTo(x + 2 * aw, y);
        ctx.lineTo(x + w, y + h / 2); ctx.lineTo(x + 2 * aw, y + h); ctx.lineTo(x + 2 * aw, y + 2 * ah);
        ctx.lineTo(x, y + 2 * ah);
        ctx.closePath(); ctx.stroke();
        renderLabel(s);
      }

      ctx.restore();

      if (selectedShapes.length === 1 && selectedShapes[0] === s && !isPreview && !isDrawing && s.type !== 'dot') {
        ctx.save();
        ctx.setLineDash([]);
        const handles = getHandles(s);
        ctx.fillStyle = '#00ffcc';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1 / zoom;
        handles.forEach(h => {
          ctx.beginPath(); ctx.arc(h.x, h.y, HANDLE_SIZE / (2 * zoom), 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        });

        const rotPt = getRotateHandlePos(s);
        const topMid = transformPoint(s.x + s.w / 2, s.y, cx, cy, s.rotation || 0);

        ctx.strokeStyle = '#00ffcc';
        ctx.beginPath(); ctx.moveTo(topMid.x, topMid.y); ctx.lineTo(rotPt.x, rotPt.y); ctx.stroke();

        ctx.fillStyle = '#ffcc00';
        ctx.beginPath(); ctx.arc(rotPt.x, rotPt.y, HANDLE_SIZE / (1.6 * zoom), 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }

    function renderLabel(s) {
      ctx.fillStyle = '#ffffff';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(s.label !== undefined ? s.label : s.type, s.x + s.w / 2, s.y - 6);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(zoom, zoom);

      drawGrid();
      
      shapes.forEach(s => drawShape(s));

      if (isDrawing && selectedShapes.length === 1) {
        drawShape(selectedShapes[0], true);
      }

      if (isDrawing && currentStartPoint) {
        const endPtX = snap(currentMouseWorld.x);
        const endPtY = snap(currentMouseWorld.y);

        ctx.fillStyle = '#2ecc71';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 / zoom;
        ctx.beginPath();
        ctx.arc(currentStartPoint.x, currentStartPoint.y, 6 / zoom, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#f1c40f';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 / zoom;
        ctx.beginPath();
        ctx.arc(endPtX, endPtY, 6 / zoom, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }

      /* Draw Point-to-Point Overlay Line */
      if (currentMode === 'measure' && measureStartPoint) {
        const endX = measureEndPoint ? measureEndPoint.x : snap(currentMouseWorld.x);
        const endY = measureEndPoint ? measureEndPoint.y : snap(currentMouseWorld.y);

        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 2 / zoom;
        ctx.setLineDash([6 / zoom, 4 / zoom]);
        ctx.beginPath();
        ctx.moveTo(measureStartPoint.x, measureStartPoint.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.fillStyle = '#ff00ff';
        ctx.beginPath(); ctx.arc(measureStartPoint.x, measureStartPoint.y, 4 / zoom, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(endX, endY, 4 / zoom, 0, Math.PI * 2); ctx.fill();
      }

      /* Visual Indicator overlay between 2 shapes during entity measurement */
      if (currentMode === 'measure' && measureFirstShape) {
        const c1 = getShapeCenter(measureFirstShape);
        let c2 = null;

        const hitShapes = shapes.filter(s => isPointInShape(currentMouseWorld.x, currentMouseWorld.y, s) && s !== measureFirstShape);
        if (hitShapes.length > 0) {
          hitShapes.sort((a, b) => getShapeArea(a) - getShapeArea(b));
          c2 = getShapeCenter(hitShapes[0]);
        } else {
          c2 = { x: currentMouseWorld.x, y: currentMouseWorld.y };
        }

        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 1.5 / zoom;
        ctx.setLineDash([4 / zoom, 4 / zoom]);
        ctx.beginPath();
        ctx.moveTo(c1.x, c1.y);
        ctx.lineTo(c2.x, c2.y);
        ctx.stroke();

        ctx.fillStyle = '#00ffcc';
        ctx.beginPath(); ctx.arc(c1.x, c1.y, 4 / zoom, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(c2.x, c2.y, 4 / zoom, 0, Math.PI * 2); ctx.fill();
      }

      ctx.restore();
    }

    resizeCanvas();
    updateScaleDisplay();
  </script>
</body>
</html>
